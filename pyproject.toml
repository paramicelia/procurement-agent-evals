[project]
name = "procurement-agent-evals"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# A deliberate, common-sense subset rather than ruff's full rule catalog:
# correctness + import hygiene + a few readability rules. Pyflakes (F) and
# pycodestyle errors (E) catch real bugs; the rest are enabled because they
# are cheap to satisfy and keep the diff clean, not because every possible
# ruff rule is worth blocking a merge over in a small demo repo.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length is handled by the formatter/line-length setting, not a hard error here
    "UP042",  # str+Enum (not enum.StrEnum) is intentional: plain str values for Pydantic/JSON, see models.py
]

[tool.pytest.ini_options]
pythonpath = ["."]
